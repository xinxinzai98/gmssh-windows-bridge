name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      # Isolated imports exercise the installed package, not the checkout.
      - run: python -I -m gmssh_windows_bridge --help
      - run: python -I -m gmssh_windows_bridge --version
      - run: python -m unittest discover -s tests -v
