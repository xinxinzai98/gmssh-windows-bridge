name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[desktop,ai]"
      # Isolated imports exercise the installed package, not the checkout.
      - run: python -I -m gmssh_windows_bridge --help
      - run: python -I -m gmssh_windows_bridge --version
      - run: python -I -m gmssh_windows_bridge.ai --help
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_share_bundle.py --check-only
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: desktop-web
      - run: npm run build
        working-directory: desktop-web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ".[desktop]"
      - run: node --experimental-vm-modules --test --test-concurrency=1 tests/*.cjs
      - run: git diff --exit-code -- gmssh_windows_bridge/desktop_web
  connect:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -v
        working-directory: tools/windows_connect
        env:
          GO111MODULE: 'off'
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.13'
      - run: python -m pip install ".[desktop]"
        if: runner.os == 'Linux'
      - run: python tests/ai_controller_integration.py --go go
        if: runner.os == 'Linux'
