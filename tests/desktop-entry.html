<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>桌面图标路由回归检查</title>
<style>
body{font:16px system-ui;background:#17191d;color:#eee;padding:24px}.tabs-container{height:48px;display:flex;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.native-card{padding:20px;background:#30343c}.machine-operate-btn-gm{background:#5267f4;color:white;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}pre{white-space:pre-wrap}button{cursor:pointer}
</style>
<h1>桌面图标路由回归检查</h1>
<p>只使用本机模拟卡片，不连接远程电脑。由项目根目录运行 python -m http.server 后打开本页。</p>
<button id="run">运行检查</button> <button id="preview">查看本地列表预览</button><pre id="result">待运行</pre>
<div class="tabs-container"><div class="tabs-home"><button class="tab-chip tab-chip--home">首页</button></div></div>
<input placeholder="搜索机器名称、IP或备注">
<div class="machine-body"><div class="native-table-header">原生表头</div><div class="machine-card-scroll"><div class="n-scrollbar-container"><div class="grid"></div></div></div></div>
<script src="../desktop-web/public/gmssh-entry.js"></script>
<script src="../desktop-web/public/gmssh-home.js"></script>
<script>
document.querySelector('#preview').onclick=async()=>{
  window.removeGMSSHHome?.();window.removeWindowsDesktopEntry?.();const grid=document.querySelector('.grid');grid.replaceChildren();
  for(const [id,name,ip] of [['preview-windows','演示工作站','192.0.2.42'],['preview-linux','演示 Linux 服务器','192.0.2.43']]){
    const card=document.createElement('article');card.dataset.machineId=id;
    card.innerHTML='<img class="machine-icon-img" src="../desktop-web/public/ui-icons/terminal-window.svg" alt="Linux"><div class="machine-name"><span class="name-txt"></span></div><span class="machine-ip"></span><div class="machine-latency-badge">20ms</div><div class="machine-progress"><span class="label-value">12.0%</span></div><div class="machine-progress"><span class="label-value">4 / 16GB</span></div><div class="machine-progress"><span class="label-value">80 / 256GB</span></div><button data-machine-action="desktop">桌面</button><button data-machine-action="terminal">终端</button>';
    card.querySelector('.name-txt').textContent=name;card.querySelector('.machine-ip').textContent=ip;grid.append(card);
  }
  const css=await fetch('../desktop-web/public/gmssh-theme.css').then(reply=>reply.text());
  installGMSSHHome({machineId:'preview-windows',target:'192.0.2.42',viewerUrl:location.origin+'/',css});
};
document.querySelector('#run').onclick = async () => {
  const result = document.querySelector('#result');
  const grid = document.querySelector('.grid');
  const checks = [];
  const assert = (ok, message) => { if (!ok) throw Error(message); checks.push('PASS ' + message); };
  const viewerUrl = location.origin + '/tests/desktop-entry-viewer.html';
  const settle = () => new Promise(resolve => requestAnimationFrame(resolve));
  const addNative = (id) => {
    const node = document.createElement('article');
    node.className = 'native-card'; node.dataset.machineId = id;
    node.innerHTML = '<img class="machine-icon-img" src="../desktop-web/public/ui-icons/terminal-window.svg" alt="Linux"><b class="machine-name"></b><span class="machine-ip">192.0.2.7</span><div class="h-[22px] rounded-full">80ms</div><div class="machine-progress"><span class="label">CPU(8核):</span><span class="label-value">12.0%</span></div><div class="machine-progress"><span class="label-value">4 / 16GB</span></div><div class="machine-progress"><span class="label-value">80 / 256GB</span></div><button class="machine-operate-btn machine-operate-btn-gm" data-machine-action="desktop"><i>◉</i></button>';
    node.querySelector('b').textContent = id;
    node.querySelector('button').onclick = () => { node.dataset.nativeCalls = String(Number(node.dataset.nativeCalls || 0) + 1); };
    grid.append(node); return node;
  };
  try {
    window.removeGMSSHHome?.(); window.removeWindowsDesktopEntry?.(); grid.replaceChildren();
    localStorage.setItem('GmsshMachineView','list');
    const controller = installWindowsDesktopEntry({ machineId: 'synthetic-windows', viewerUrl });
    const windows = addNative('synthetic-windows'), linux = addNative('synthetic-linux');
    const extra = Array.from({length:14}, (_,index)=>addNative('synthetic-linux-' + (index+3)));
    await settle();
    assert(windows.querySelector('img').src.endsWith('/ui-icons/windows.svg') && linux.querySelector('img').alt === 'Linux', '仅已绑定的 Windows 原生卡片使用 Windows 图标，Linux 图标保留');
    const css = await fetch('../desktop-web/public/gmssh-theme.css',{cache:'no-store'}).then(response=>response.text());
    const home = installGMSSHHome({ machineId:'synthetic-windows', viewerUrl, css });
    assert(document.querySelector('.machine-body').classList.contains('gm-native-source') && !document.querySelector('.machine-body').contains(document.querySelector('#gmssh-machine-workspace')),'替换整个原生列表区域，增强表格放在原生表头与滚动容器之外');
    assert(document.querySelector('[data-gmssh-row="synthetic-windows"] .gm-os-icon').alt === 'Windows' && document.querySelector('[data-gmssh-row="synthetic-linux"] .gm-os-icon').src === linux.querySelector('img').src, '首页设备列表区分 Windows 与 Linux 系统图标');
    assert(document.querySelector('[data-gmssh-row="synthetic-windows"] .gm-identity-text small').textContent==='状态待确认','尚未收到设备探测时不把本机桥的延迟当成 Windows 网络延迟');
    assert(document.querySelectorAll('th .gm-ui-icon').length === 3 && document.querySelectorAll('.gm-detail-metric .gm-ui-icon').length === 3, 'CPU、内存、磁盘表头及详情使用小图标');
    assert([...document.querySelectorAll('[data-gmssh-row] button[title="文件互传"] img')].every(image=>image.src.endsWith('/arrows-left-right.svg')), 'Windows 和 Linux 统一使用双向箭头与文件互传名称');
    assert(document.querySelector('.gm-device-details h3:nth-of-type(2)').textContent==='资源使用' && !document.querySelector('.gm-identity-text small').textContent.includes('Windows'), '资源使用去掉当前，设备名称旁不重复标注 Windows');
    assert(document.querySelector('[data-gmssh-row="synthetic-linux"] .gm-status-dot.good').title==='80ms' && document.querySelector('[data-gmssh-row="synthetic-linux"] .gm-device-identity').title.includes('8 逻辑核'), '延迟读取原生徽标，设备悬浮提示包含处理器和配置容量');
    const linuxInfo={id:'synthetic-linux',osName:'Ubuntu 24.04',runTime:'11 天 2 小时',processNum:124,activeProcessNum:0,lastUpdateTime:1700000000,
      authValue:'must-not-render-native-credential',disks:[{device:'/dev/vda1',total:String(256*1024**3),used:String(80*1024**3),authValue:'must-not-render-disk-credential'},{device:'/dev/invalid',total:100,used:120}]};
    const productionRoot=document.createElement('div');productionRoot.id='app';document.body.append(productionRoot);
    productionRoot._vnode={component:{subTree:{children:[{component:{props:{record:linuxInfo}}}]}}};home.select('synthetic-linux');
    let linuxDetails=document.querySelector('.gm-device-details').textContent;
    assert(!linux.__vueParentComponent&&linuxDetails.includes('11 天 2 小时')&&linuxDetails.includes('活动 / 总进程0 / 124'),'生产版没有 DOM 调试字段时，Linux 详情仍显示原生运行时间和进程零值');
    assert(linuxDetails.includes('磁盘分区')&&linuxDetails.includes('/dev/vda1')&&linuxDetails.includes('80.0 GB / 256.0 GB')&&!linuxDetails.includes('/dev/invalid'),'Linux 磁盘明细使用原生已用/总量并拒绝无效数值');
    assert(linuxDetails.includes('更新于')&&!document.querySelector('#gmssh-machine-workspace').textContent.includes('must-not-render'),'Linux 公共信息映射不展示原生或分区凭据');
    linuxInfo.runTime='12 天';linuxInfo.processNum=125;home.refresh();
    assert(document.querySelector('.gm-device-details').textContent.includes('12 天')&&document.querySelector('.gm-device-details').textContent.includes('0 / 125'),'原生监控刷新后，Linux 详情同步更新');
    home.select('synthetic-windows');productionRoot.remove();
    const savedAPI=window.electronAPI;let copied;
    window.electronAPI={invoke:async(_channel,request)=>{copied=request.data;return {status:'ok'};}};
    document.querySelector('.gm-copy-address').click();await settle();
    assert(copied==='192.0.2.7' && document.querySelector('[role="status"]').textContent==='IP 地址已复制','右侧 IP 点击复制精确地址并显示成功提示');
    home.select('synthetic-linux');document.querySelector('[data-gmssh-row="synthetic-windows"] button[title="更多操作"]').click();await settle();
    const deviceMenu=document.querySelector('.gm-device-context');
    assert(deviceMenu.textContent.includes('设备详情')&&deviceMenu.textContent.includes('复制 IP 地址')&&deviceMenu.textContent.includes('电源操作'),'每行更多菜单包含详情、地址复制与 Windows 电源入口');
    const readonlyCalls=[],savedTools=window.gmsshToolsController;window.gmsshToolsController={open:(id,tool)=>readonlyCalls.push({id,tool})};
    [...deviceMenu.querySelectorAll('button')].find(button=>button.textContent==='连接诊断').click();
    assert(readonlyCalls[0].id==='synthetic-windows'&&readonlyCalls[0].tool==='diagnostics','更多菜单的连接诊断只定位所选设备');
    document.querySelector('[data-gmssh-row="synthetic-windows"] button[title="更多操作"]').click();await settle();
    [...document.querySelector('.gm-device-context').querySelectorAll('button')].find(button=>button.textContent==='设备详情').click();await settle();
    const detailsDialog=document.querySelector('.gm-device-dialog'),drawer=detailsDialog.querySelector('.gm-device-details');
    assert(detailsDialog.open&&getComputedStyle(drawer).display!=='none'&&drawer.querySelector('.gm-copy-address')&&drawer.textContent.includes('电源'),'详情抽屉在窄窗口仍保留地址复制与电源操作');
    [...drawer.querySelectorAll('button')].find(button=>button.textContent==='系统工具').click();
    assert(readonlyCalls[1].id==='synthetic-windows'&&readonlyCalls[1].tool==='processes','设备详情的系统工具沿用同一个设备 ID');window.gmsshToolsController=savedTools;
    assert(document.querySelector('#gmssh-machine-workspace .gm-device-details h2').textContent==='synthetic-windows','从更多打开详情会选中该设备，状态采集不会留在上一台设备');
    const drawerBounds=detailsDialog.getBoundingClientRect();assert(drawerBounds.left>=0&&drawerBounds.right<=innerWidth&&drawerBounds.bottom<=innerHeight,'详情抽屉保持在当前窗口范围内');
    detailsDialog.querySelector('.gm-device-dialog-head button').click();await settle();
    assert(!detailsDialog.open&&!detailsDialog.querySelector('.gm-device-details'),'关闭详情抽屉后移除临时内容，保留正常设备详情');
    window.electronAPI={invoke:async()=>({status:'error'})};document.querySelector('.gm-copy-address').click();await settle();
    assert(document.querySelector('[role="status"]').textContent.includes('复制失败'),'复制失败不会显示成功提示');window.electronAPI=savedAPI;
    const list = document.querySelector('.gm-device-list');
    assert(list.clientHeight > 0 && list.scrollHeight > list.clientHeight && list.getBoundingClientRect().bottom <= innerHeight, '16 台设备的列表在窗口内独立滚动');
    list.scrollTop = list.scrollHeight;
    const last = document.querySelector('[data-gmssh-row="synthetic-linux-16"]');
    assert(last.getBoundingClientRect().bottom <= list.getBoundingClientRect().bottom + 1, '滚动到底部后最后一台设备完整可见');
    const headerTop = list.querySelector('th').getBoundingClientRect().top;
    assert(Math.abs(headerTop - list.getBoundingClientRect().top) < 3, '滚动时设备表头保持固定');
    last.click();
    assert(document.querySelector('.gm-device-details h2').textContent === 'synthetic-linux-16', '最后一台设备可选择并显示详情');
    const bottom = list.scrollTop;
    windows.querySelector('.machine-name').textContent = 'updated Windows'; home.refresh();
    assert(document.querySelector('.gm-device-list') === list && Math.abs(list.scrollTop-bottom) < 1, '实时刷新和选择设备保留同一滚动区域及底部位置');
    let paged=false;const nativeScroll=document.querySelector('.n-scrollbar-container');nativeScroll.addEventListener('scroll',()=>{paged=true;},{once:true});list.dispatchEvent(new Event('scroll'));
    assert(paged,'滚到底部同步原生分页滚动事件，继续加载尚未呈现的设备');
    localStorage.setItem('GmsshMachineView','card');home.refresh();
    assert(document.querySelectorAll('.gm-device-card').length===16 && !document.querySelector('.gm-device-table'),'原生卡片显示设置生成完整卡片布局');
    list.scrollTop=list.scrollHeight;document.querySelector('[data-gmssh-row="synthetic-linux-16"]').click();
    assert(document.querySelector('.gm-device-details h2').textContent==='synthetic-linux-16','卡片模式也可滚动选择最后的设备');
    localStorage.setItem('GmsshMachineView','list');home.refresh();
    assert(document.querySelector('.gm-device-table') && Math.abs(list.scrollTop-bottom)<1,'切回列表保留独立的滚动位置与设备选择');
    let context,backgroundMenu=0;const background=event=>{if(event.target.closest('#gmssh-machine-workspace'))backgroundMenu++;};document.body.addEventListener('contextmenu',background);
    linux.addEventListener('contextmenu',event=>{context={target:event.target.dataset.machineId,x:event.clientX,y:event.clientY};event.preventDefault();});
    document.querySelector('[data-gmssh-row="synthetic-linux"]').dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:40,clientY:60}));
    assert(context?.target==='synthetic-linux'&&context.x===40&&context.y===60&&backgroundMenu===0,'右键只转交原机器的编辑菜单，避免被背景菜单覆盖');document.body.removeEventListener('contextmenu',background);
    let editedId;window.gmsshPairingController={edit:id=>editedId=id};
    document.querySelector('[data-gmssh-row="synthetic-windows"]').dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:innerWidth-5,clientY:innerHeight-5}));
    const contextMenu=document.querySelector('.gm-device-context');
    assert(contextMenu.matches(':popover-open')&&contextMenu.getBoundingClientRect().right<=innerWidth,'Windows 右键编辑菜单在窗口边缘仍完整可见');
    [...contextMenu.querySelectorAll('button')].find(button=>button.textContent==='编辑连接地址').click();assert(editedId==='synthetic-windows','Windows 编辑地址进入已核验设备向导');delete window.gmsshPairingController;
    linux.querySelector('.machine-ip').textContent='2001:db8:1234:5678:9abc:def0:1234:5678';home.refresh();home.select('synthetic-linux');
    const fullAddress=linux.querySelector('.machine-ip').textContent;
    assert(document.querySelector('[data-gmssh-row="synthetic-linux"] .gm-address').title===fullAddress&&document.querySelector('.gm-copy-address').title.startsWith(fullAddress)&&document.querySelector('.gm-copy-address').scrollWidth<=document.querySelector('.gm-copy-address').clientWidth+1,'长 IPv6 地址可悬浮查看完整值，复制入口保留完整文本且不溢出');
    const nativeView=document.createElement('webview');nativeView.className='home-container-view';nativeView.setAttribute('src',location.origin+'/newweb/#/home?machineId=synthetic-linux');let fileCalls=0;
    nativeView.executeJavaScript=async code=>{assert(code.includes('window.$gm.openFolder("/")')&&!code.includes('token'),'Linux 文件入口只调用固定的内置文件 SDK');fileCalls++;return true;};document.body.append(nativeView);
    document.querySelector('[data-gmssh-row="synthetic-linux"] button[title="文件互传"]').click();await settle();
    assert(fileCalls===1&&linux.dataset.nativeCalls==='1','Linux 先打开对应原生桌面再进入文件管理器，未发起安装或额外认证');
    nativeView.remove();delete linux.dataset.nativeCalls;
    home.remove();
    extra.forEach(node=>node.remove());
    windows.querySelector('i').click();
    const panel = document.querySelector('#gmssh-windows-panel'), frame = panel?.querySelector('iframe');
    assert(frame && !windows.dataset.nativeCalls, '已绑定机器的原蓝色图标进入 Windows 分支，阻止原 Linux 入口');
    assert(document.querySelector('[role="tab"] img').src.endsWith('/ui-icons/windows.svg'), '顶部 Windows 桌面标签沿用同一系统图标');
    document.querySelector('.tab-chip--home').click();
    assert(panel.hidden && panel.querySelector('iframe') === frame, '切回首页保留同一会话');
    linux.querySelector('i').click();
    assert(linux.dataset.nativeCalls === '1' && panel.hidden, '其他机器的原生桌面逻辑不受影响');
    windows.querySelector('i').click();
    assert(!panel.hidden && panel.querySelector('iframe') === frame, '再次点击机器原图标切回原会话');
    controller.remove(); windows.querySelector('i').click();
    assert(windows.dataset.nativeCalls === '1', '卸载后恢复原图标逻辑');
    assert(windows.querySelector('img').alt === 'Linux' && windows.querySelector('img').getAttribute('src') === '../desktop-web/public/ui-icons/terminal-window.svg', '卸载后恢复原始系统图标与替代文本');
    windows.classList.add('list-item-group');
    const listController = installWindowsDesktopEntry({ machineId:'synthetic-windows', viewerUrl });
    assert(windows.querySelector('img').alt === 'Windows', '原生列表视图也使用 Windows 图标');
    windows.dataset.machineId = 'recycled-linux'; await settle();
    assert(windows.querySelector('img').alt === 'Linux', '原生节点复用于 Linux 设备时恢复系统图标');
    listController.remove();

    const desktop = installWindowsDesktopEntry({ viewerUrl, label: 'Test A4', card: { host: '100.64.0.7', name: 'synthetic-a4' } });
    const card = document.querySelector('[data-windows-desktop-card]');
    assert(card?.querySelector('.machine-operate [data-machine-action="desktop"].machine-operate-btn-gm') && !document.querySelector('[data-windows-desktop-launcher]'), '桌面专用卡片复用原蓝色图标及样式容器，没有悬浮入口');
    const search = document.querySelector('input'); search.value = 'Test A4';
    search.dispatchEvent(new Event('input', { bubbles: true }));
    windows.remove(); linux.remove();
    search.dispatchEvent(new Event('input', { bubbles: true }));
    assert(card.isConnected && !card.hidden, '仅匹配桌面卡片时搜索仍保留入口');
    card.querySelector('i').click();
    assert(document.querySelector('#gmssh-windows-panel') && document.querySelectorAll('.gmssh-windows-tab').length === 1, '桌面卡片沿同一图标事件进入对应顶部标签');
    desktop.remove();
    assert(!document.querySelector('[data-windows-desktop-card]'), '卸载清除桌面专用卡片');
    let rejected = false;
    try { installWindowsDesktopEntry({ machineId: 'synthetic-windows', viewerUrl: 'https://example.com/' }); } catch { rejected = true; }
    assert(rejected, '继续拒绝非本机查看器');
    search.value='';
    const first=addNative('first-windows'),second=addNative('second-windows');
    first.querySelector('.machine-ip').textContent=second.querySelector('.machine-ip').textContent='127.0.0.1';
    const entries=[{machineId:'first-windows',viewerUrl,label:'First PC'},{machineId:'second-windows',viewerUrl:new URL('other/',viewerUrl).href,label:'Second PC',autoConnect:true}];
    installWindowsDesktopEntries(entries);first.querySelector('i').click();
    const firstPanel=document.querySelector('[data-windows-machine="first-windows"]'),firstFrame=firstPanel.querySelector('iframe');
    second.querySelector('i').click();
    const secondPanel=document.querySelector('[data-windows-machine="second-windows"]'),secondFrame=secondPanel.querySelector('iframe');
    assert(firstPanel.hidden&&!secondPanel.hidden&&firstPanel.id!==secondPanel.id,'多台 Windows 使用独立桌面标签，切换保留各自会话');
    document.querySelector('button[aria-label="关闭 First PC"]').click();
    assert(!secondPanel.hidden&&document.documentElement.hasAttribute('data-windows-desktop-active'),'关闭后台桌面不会清除前台桌面的选中状态');
    installWindowsDesktopEntries(entries);
    assert(document.querySelector('[data-windows-machine="second-windows"] iframe')===secondFrame&&document.querySelectorAll('.gmssh-windows-tabs').length===1,'重新配置设备复用已有会话与同一行标签容器');
    const multi=installGMSSHHome({viewerUrl,css,devices:[{machineId:'first-windows',viewerUrl,target:'192.0.2.10',targetPort:22},{machineId:'second-windows',viewerUrl:entries[1].viewerUrl,target:'192.0.2.11',targetPort:2222}]});
    multi.select('second-windows');
    assert(document.querySelectorAll('.gm-device-identity .gm-os-icon[alt="Windows"]').length===2&&document.querySelector('.gm-copy-address').textContent==='192.0.2.11'&&document.querySelector('.gm-device-details').textContent.includes('2222'),'多台 Windows 独立显示系统图标、真实地址和 SSH 端口');
    await settle();let tool;
    secondFrame.contentWindow.postMessage=(message,origin)=>{tool={message,origin};};
    window.gmsshWindowsControllers.get('second-windows').open();
    assert(tool?.message.tool==='reconnect'&&tool.origin===new URL(entries[1].viewerUrl).origin&&document.querySelector('[data-windows-machine="second-windows"] iframe')===secondFrame,'再次打开卡片仅向原查看器请求恢复已保存的连接，不重建标签');
    document.querySelector('[data-gmssh-row="second-windows"] button[title="文件互传"]').click();
    assert(tool?.message.tool==='files'&&tool.origin===new URL(entries[1].viewerUrl).origin,'多台设备的文件工具投递到被选中的桌面');
    let independentId;const previousFiles=window.gmsshFilesController;window.gmsshFilesController={open:id=>independentId=id,hide(){}};
    window.gmsshWindowsControllers.get('second-windows').close();document.querySelector('[data-gmssh-row="second-windows"] button[title="文件互传"]').click();
    assert(independentId==='second-windows'&&!document.querySelector('[data-windows-machine="second-windows"]'),'有独立文件中心时从卡片直接打开文件，不创建桌面标签');window.gmsshFilesController=previousFiles;
    multi.remove();window.removeWindowsDesktopEntry();first.remove();second.remove();
    result.textContent = checks.join('\n') + '\n全部通过';
  } catch (error) { result.textContent = checks.join('\n') + '\nFAIL ' + error.message; }
};
</script>
</html>
