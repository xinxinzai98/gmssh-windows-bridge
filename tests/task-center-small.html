<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>任务管理窄窗口检查</title><style>body{background:#141416;color:#ddd;font:14px system-ui}iframe{width:420px;height:640px;border:1px solid #555;max-width:100%}pre{white-space:pre-wrap}</style><h1>420 × 640 任务管理</h1><button id="run">检查布局</button><pre id="result">待运行</pre><iframe id="small" title="任务管理窄窗口" src="task-center-entry.html?preview=1"></iframe><script>
document.getElementById('run').onclick=async()=>{const checks=[],assert=(v,t)=>{if(!v)throw Error(t);checks.push('PASS '+t);};try{const frame=document.getElementById('small');for(let i=0;i<200&&!frame.contentDocument.querySelector('.gm-files-task');i++)await new Promise(r=>setTimeout(r,25));const doc=frame.contentDocument,within=node=>{const b=node.getBoundingClientRect();return b.left>=0&&b.right<=420;};assert(doc.documentElement.scrollWidth<=420,'窄窗口无页面水平溢出');assert([...doc.querySelectorAll('.gm-files-filters input,.gm-files-filters select,.gm-files-batch button')].every(within),'搜索、筛选和批量按钮均在窗口内');assert([...doc.querySelector('.gm-files-task').querySelectorAll('button')].every(within),'单项操作在窗口内换行');const pane=doc.querySelector('.gm-files-tasks');pane.scrollTop=pane.scrollHeight;assert(pane.scrollTop>0,'任务列表可以滚动到末尾');const more=doc.querySelector('.gm-files-more');assert(more.getBoundingClientRect().bottom<=640,'加载下一页按钮可以滚动到达');more.click();assert(doc.querySelectorAll('.gm-files-task').length===100,'窄窗口仍可继续显示下一批任务');document.getElementById('result').textContent=checks.join('\n')+'\n全部通过';}catch(e){document.getElementById('result').textContent=checks.join('\n')+'\nFAIL '+e.message;}};
</script></html>
