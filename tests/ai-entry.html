<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AI 接入 · 合成数据验收</title>
<link rel="stylesheet" href="../desktop-web/public/gmssh-theme.css"><link rel="icon" href="data:,">
<style>body{margin:0;background:#141416;color:#ddd;font:14px system-ui}header{height:58px;display:flex;align-items:center;padding:0 24px;gap:18px;border-bottom:1px solid #333}.layout{display:flex;height:calc(100vh - 58px)}aside{width:180px;flex:none;padding:24px 12px;box-sizing:border-box;line-height:3;background:#171719}main{min-width:0;flex:1;padding:24px}.machine-manage{display:block!important}.machine-manage .machine-head{display:flex!important;align-items:center;justify-content:space-between;gap:12px}.head-right{display:flex;gap:8px}.placeholder{padding:30px;margin-top:24px;border:1px solid #333;border-radius:8px;color:#999}.test-tools{position:fixed;bottom:8px;left:200px;right:10px;font-size:12px}#result{white-space:pre-wrap;max-height:25vh;overflow:auto}body.compact .layout aside{display:none}body.compact main{padding:12px}body.compact .test-tools{left:12px}</style>
<header><strong>GMSSH</strong><span>首页</span><small>AI 接入 · 本地合成预览</small></header>
<div class="layout"><aside>我的桌面<br>快捷命令<br>批量执行<br>AI 偏好<br>设置</aside><main class="machine-manage"><div class="machine-head"><strong>全部分组</strong><div class="head-right"></div></div><div class="placeholder">仅使用合成设备，不读取真实钥匙串、剪贴板或连接远端电脑。</div></main></div>
<div class="test-tools"><button id="run">运行界面检查</button><button id="preview">查看示例面板</button><button id="preview-tasks">查看任务面板</button><pre id="result">待运行</pre></div>
<script src="../desktop-web/public/gmssh-ai.js"></script><script>
const id='a'.repeat(32),code='GMSSH-AUTH2.SYNTHETIC-NOT-A-REAL-CREDENTIAL';let devices=[],calls=[],checkingCode='OK',slow=false,release,prepared=false;
const identity={id,computer:'演示工作站',name:'设计工作站',addresses:['2001:db8:110::42','192.0.2.42'],fingerprint:'SHA256:SYNTHETIC-IDENTITY-ONLY',allow:['inspect'],granted:{view:true,input:true,terminal:true,files:true,clipboard:false,power:false}};
const taskRecords=[{device:id,taskId:'c'.repeat(32),requestKey:'d'.repeat(32),state:'running',code:'OK',exitCode:null,observedAt:new Date().toISOString()},{device:id,taskId:null,requestKey:'e'.repeat(32),state:'unknown',code:'START_RESPONSE_UNKNOWN',exitCode:null,observedAt:new Date().toISOString()}];
window.electronAPI={invoke:async(channel,request)=>{
 if(channel!=='render-to-main'||request.type!=='gmssh-ai')throw Error('unexpected IPC');calls.push(structuredClone(request.data));const {action,data}=request.data;
 if(action==='clear'){release?.();return {status:'ok',data:{}};}
 if(action==='list'){if(slow)await new Promise(resolve=>release=resolve);return {status:'ok',data:{version:'0.4.0a29',devices:structuredClone(devices)}};}
 if(action==='history')return {status:'ok',data:{tasks:structuredClone(taskRecords),canQuery:devices.find(device=>device.id===data.device)?.allow.includes('terminal'),scope:'local-observations',remoteStateChecked:false,pruned:false,retentionLimit:200}};
 if(action==='task'){taskRecords[0].state='failed';taskRecords[0].code='EXIT_NONZERO';taskRecords[0].exitCode=7;return {status:'ok',data:{ok:true,result:{...taskRecords[0],output:'<img src=x onerror=alert(1)> 中文输出',more:true,truncated:false}}};}
 if(action==='preview'||action==='paste-preview'){if(action==='preview'&&data.code!==code)return {status:'error',code:'INVALID_ARGUMENT'};return {status:'ok',data:{...identity,name:devices[0]?.name||identity.name,existing:!!devices.length,allow:devices[0]?.allow||['inspect'],preview:'p'.repeat(32)}};}
 if(action==='enroll'){devices=[{...identity,name:data.name,allow:data.allow,source:'keychain',transport:'controller',accessStored:true}];return {status:'ok',data:{id}};}
 if(action==='configure'){devices[0].allow=data.allow;delete devices[0].lastCheck;return {status:'ok',data:{id}};}
 if(action==='check'){devices[0].lastCheck={state:checkingCode==='OK'?'passed':'partial',code:checkingCode,checkedAt:new Date().toISOString(),effective:{inspect:true,terminal:true,files:true,view:true,input:checkingCode==='OK'},features:{desktopState:checkingCode==='OK'?'ready':'paused'}};return {status:'ok',data:{ok:true,result:devices[0].lastCheck}};}
 if(action==='doctor'||action==='prepare'){if(action==='prepare')prepared=true;return {status:'ok',data:{ready:prepared,deviceConnectionsAttempted:0,checks:[{id:'mcp',state:prepared?'passed':'failed',code:prepared?'OK':'AI_DEPENDENCY_REQUIRED'}]}};}
 if(action==='config')return {status:'ok',data:{format:data.format,text:data.format==='codex'?'[mcp_servers.gmssh]\ncommand = "/synthetic/python"\nargs = ["-I", "-m", "gmssh_windows_bridge.ai", "mcp"]':data.format==='codex-cli'?'codex mcp add gmssh -- /synthetic/python -m gmssh_windows_bridge.ai mcp':JSON.stringify({mcpServers:{gmssh:{command:'/synthetic/python',args:['-m','gmssh_windows_bridge.ai','mcp']}}},null,2)}};
 if(action==='copy')return {status:'ok',data:{copied:true}};
 throw Error('unexpected setup action '+action);
}};
const controller=installGMSSHAI({viewerUrl:location.origin+'/desktop-web/public/'}),get=label=>document.querySelector('[aria-label="'+label+'"]'),settle=()=>new Promise(resolve=>setTimeout(resolve,30));
const click=text=>{const button=[...document.querySelectorAll('.gm-ai-dialog button')].find(node=>node.textContent.trim()===text);if(!button)throw Error('missing '+text);button.click();};
document.querySelector('#preview').onclick=async()=>{devices=[{...identity,allow:['inspect','files','terminal','view','input'],source:'keychain',transport:'controller',accessStored:true,lastCheck:{state:'passed',code:'OK',checkedAt:new Date().toISOString()}}];await controller.open();};
document.querySelector('#preview-tasks').onclick=async()=>{await document.querySelector('#preview').onclick();click('任务记录');};
document.querySelector('#run').onclick=async()=>{
 const checks=[],assert=(condition,label)=>{if(!condition)throw Error(label);checks.push('PASS '+label);};
 window.aiChecks={running:true};document.querySelector('#result').textContent='正在运行…';Object.assign(taskRecords[0],{state:'running',code:'OK',exitCode:null});
 try{
  devices=[];calls=[];prepared=false;checkingCode='OK';slow=false;await controller.open();assert(document.querySelector('.gm-ai-empty').textContent.includes('先添加一台电脑'),'空状态说明独立授权接入步骤');
  click('添加授权');await settle();get('Windows 独立授权码').value=code;click('核对设备');await settle();
  assert(!get('Windows 独立授权码'),'预览后移除包含原码的输入框');assert(document.querySelector('.gm-ai-preview').textContent.includes(identity.fingerprint),'预览包含电脑、IPv6 和主机身份');
  assert(get('允许设备信息').checked&&!get('允许执行命令').checked,'默认只允许设备信息');get('允许操作桌面').click();assert(get('允许查看桌面').checked,'操作桌面自动选择查看权限');get('允许查看桌面').click();assert(!get('允许操作桌面').checked,'取消查看同时取消桌面操作');
  get('允许操作桌面').click();get('AI 设备名称').value='工作站 AI';click('启用 AI 访问');await settle();
  const enrolled=calls.findLast(call=>call.action==='enroll');assert(!JSON.stringify(enrolled).includes(code)&&enrolled.data.preview,'保存只提交预览编号，不重新传原码');assert(document.querySelector('.gm-ai-state').textContent.includes('尚未检查'),'保存配置不冒充远端已连接');assert(document.querySelector('[role=tab][aria-selected=true]').tabIndex===0,'保存后当前标签仍可由键盘访问');
  click('检查接入');await settle();assert(document.querySelector('.gm-ai-state').textContent.includes('检查通过'),'实际检查结果显示时间与成功状态');checkingCode='AI_PAUSED';click('检查接入');await settle();assert(document.querySelector('.gm-ai-state').textContent.includes('已暂停'),'暂停状态不冒充桌面可操作');
  click('调整权限');await settle();get('允许执行命令').click();click('保存本机权限');await settle();assert(document.querySelector('.gm-ai-state').textContent.includes('尚未检查'),'改权限后旧检查结果失效');
  click('停用');await settle();assert(!devices[0].allow.length&&[...document.querySelectorAll('.gm-ai-device button')].find(node=>node.textContent==='检查接入').disabled,'停用后不允许检查或新的远端操作');
  click('添加授权');await settle();click('从剪贴板粘贴');await settle();assert(document.querySelector('.gm-ai-status').textContent.includes('已经添加'),'重复授权进入明确的更新流程');assert(get('AI 设备名称').disabled,'更新原授权保留设备名');get('允许设备信息').click();click('更新已有授权');await settle();assert(devices.length===1&&devices[0].allow.includes('inspect'),'更新保留一条原设备');
  click('调整权限');await settle();get('允许执行命令').click();click('保存本机权限');await settle();const beforeTasks=calls.filter(call=>call.action==='task').length;click('任务记录');await settle();assert(document.querySelector('.gm-ai-task').textContent.includes('上次观察：运行中')&&calls.filter(call=>call.action==='task').length===beforeTasks,'打开任务记录只读本地，不冒充当前状态或自动连接');assert([...document.querySelectorAll('.gm-ai-task button')].at(-1).disabled&&document.querySelector('.gm-ai-tasks').textContent.includes('不要作为新命令重复执行'),'未知提交保留请求键并禁用无任务号查询');click('查询远端状态');await settle();assert(document.querySelector('.gm-ai-status').textContent.includes('退出码 7')&&calls.findLast(call=>call.action==='task').data.taskId==='c'.repeat(32),'显式查询保留非零退出码且不重新执行命令');assert(get('本次任务输出').textContent.includes('<img')&&!get('本次任务输出').querySelector('img'),'任务输出作为纯文本显示');click('刷新本地记录');await settle();assert(!get('本次任务输出'),'刷新不留存远端输出');devices[0].allow=[];click('刷新本地记录');await settle();assert([...document.querySelectorAll('.gm-ai-task button')].every(node=>node.disabled),'停用终端权限后只能看本地记录');devices[0].allow=['inspect'];
  click('接入 AI 客户端');await settle();assert(get('MCP 配置预览').value.includes('mcpServers'),'生成通用 MCP JSON');get('AI 客户端配置格式').value='codex';get('AI 客户端配置格式').dispatchEvent(new Event('change'));await settle();assert(get('MCP 配置预览').value.includes('[mcp_servers.gmssh]'),'生成 Codex TOML');click('复制配置');await settle();assert(calls.findLast(call=>call.action==='copy').data.format==='codex','复制在主进程按格式生成，不传任意文本');
  click('检查组件');await settle();assert(document.querySelector('.gm-ai-runtime').textContent.includes('尚未准备'),'缺少 SDK 有明确提示');click('准备组件（需联网）');await settle();assert(document.querySelector('.gm-ai-runtime').textContent.includes('已准备就绪'),'组件准备有独立状态反馈');
  const rectangle=document.querySelector('.gm-ai-dialog').getBoundingClientRect();assert(rectangle.top>=0&&rectangle.bottom<=innerHeight+1&&rectangle.right<=innerWidth+1,'对话框在当前窗口内保持完整可达');
  click('添加授权');await settle();get('Windows 独立授权码').value=code;click('关闭');assert(!document.querySelector('.gm-ai-dialog').open&&!document.querySelector('input[type=password]'),'关闭清除密码字段与临时表单');
  slow=true;const loading=controller.open();await settle();click('关闭');release();await loading;assert(!document.querySelector('.gm-ai-dialog').open&&!document.querySelector('.gm-ai-device'),'迟到结果不能重新打开或填充已关闭窗口');slow=false;
  await controller.open();const selected=document.querySelector('[role=tab][aria-selected=true]');selected.focus();selected.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await settle();assert(document.querySelector('[role=tab][aria-selected=true]').textContent==='添加授权'&&document.activeElement.getAttribute('role')==='tab','方向键切换标签并保留标签焦点');click('关闭');
  devices=Array.from({length:50},(_,index)=>({...identity,id:(index+1).toString(16).padStart(32,'0'),name:'合成设备 '+(index+1),allow:['inspect'],source:'keychain',transport:'controller',accessStored:true}));await controller.open();const last=document.querySelector('.gm-ai-device:last-child');last.scrollIntoView({block:'end'});await settle();const edge=last.getBoundingClientRect(),area=document.querySelector('.gm-ai-content').getBoundingClientRect();assert(edge.bottom<=area.bottom+1&&edge.top>=area.top-1,'五十台设备可以滚动到最后一项');assert(document.querySelector('.gm-ai-footer').getBoundingClientRect().bottom<=innerHeight+1,'长列表滚动时底部操作区仍可达');click('关闭');
  document.querySelector('#result').textContent=checks.join('\n')+'\n全部通过';window.aiChecks={passed:checks.length,failed:0,viewport:{width:innerWidth,height:innerHeight}};
 }catch(error){document.querySelector('#result').textContent=checks.join('\n')+'\nFAIL '+error.message;window.aiChecks={passed:checks.length,failed:1,error:error.message};}
};
</script></html>
