<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流式文件中心 · 本地检查</title><link rel="stylesheet" href="/gmssh-theme.css"><style>body{background:#171719;color:#eee;font:14px system-ui;margin:0}.tabs-container{height:48px;display:flex;align-items:center;padding:0 18px;background:#141416}.tab-chip{background:#333;color:#eee;border:0;border-radius:6px;padding:7px 12px}main{padding:24px}pre{white-space:pre-wrap}main>button{margin:4px;padding:10px}</style>
<div class="tabs-container"><div class="tabs-home"><button class="tab-chip tab-chip--home">首页</button></div></div><main><h1>流式落盘与任务恢复 · 合成设备</h1><p>使用真实主进程任务代码和本机磁盘 SFTP 替身；系统选择窗口由测试桩授权固定的合成文件，不访问真实设备。</p><button id="run">运行检查</button><button id="preview">查看恢复任务</button><button id="copy-preview">查看兼容保存过程</button><pre id="result">待运行</pre></main><script src="/gmssh-files.js"></script><script>
let config,controller,requestId=0;const drivers=new Set();window.addEventListener('message',event=>{if(event.data?.type==='native-fixture-ready'&&[...document.querySelectorAll('.gm-files-frames iframe')].some(f=>f.contentWindow===event.source&&event.origin===new URL(f.src).origin))drivers.add(event.source);});const wait=async fn=>{for(let i=0;i<500;i++){if(await fn())return;await new Promise(r=>setTimeout(r,30));}throw Error('fixture wait timed out');},state=()=>fetch('/state').then(r=>r.json());
window.electronAPI={invoke:async(_channel,request)=>request.type==='gmssh-files-state'?{status:'ok'}:fetch('/native',{method:'POST',body:JSON.stringify(request.data)}).then(r=>r.json())};
const ready=fetch('/fixture-config.json').then(r=>r.json()).then(c=>{config=c;window.gmsshHomeController={filesDevices:()=>config.devices.map(d=>({id:d.machineId,name:d.label,windows:true}))};controller=installGMSSHFileCenter({viewerUrl:location.origin+'/',devices:config.devices});});
if(new URL(location.href).searchParams.get('preview')==='1')ready.then(async()=>{await wait(()=>controller.native);controller.open();tasks();});
async function command(frame,action){await wait(()=>drivers.has(frame.contentWindow));const id=++requestId;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{window.removeEventListener('message',receive);reject(Error('driver timeout'));},20000);function receive(e){if(e.source!==frame.contentWindow||e.origin!==new URL(frame.src).origin||e.data?.type!=='native-fixture-result'||e.data.requestId!==id)return;clearTimeout(timer);window.removeEventListener('message',receive);e.data.error?reject(Error(e.data.error)):resolve(e.data.result);}window.addEventListener('message',receive);frame.contentWindow.postMessage({type:'native-fixture',requestId:id,action},new URL(frame.src).origin);});}
const tasks=()=>[...document.querySelectorAll('.gm-files-header button')].find(n=>n.textContent.startsWith('全部任务')).click();
document.querySelector('.tab-chip--home').onclick=()=>controller?.hide();document.getElementById('preview').onclick=async()=>{await ready;controller.open();tasks();};
document.getElementById('copy-preview').onclick=async()=>{await ready;const d=config.devices[0];await window.electronAPI.invoke('render-to-main',{type:'gmssh-transfer',data:{action:'pick-download',machineId:d.machineId,data:{entries:[{path:'C:/资料.bin',name:'兼容保存演示-'+Date.now()+'.bin',directory:false,size:16*1024**2}]}}});controller.open();tasks();};
document.getElementById('run').onclick=async()=>{
 const out=document.getElementById('result'),checks=[],assert=(v,t)=>{if(!v)throw Error(t);checks.push('PASS '+t);};try{
  await ready;await wait(()=>controller.native);assert(document.querySelectorAll('.gm-files-frames iframe').length===0,'未打开设备文件页就恢复主进程任务记录');controller.open();tasks();await wait(()=>document.querySelector('.gm-files-task'));
  assert(document.querySelector('.gm-files-task').dataset.state==='paused','中断任务显示已暂停，没有自动重新读写本机文件');assert(document.querySelector('.gm-files-task').textContent.includes('需确认本机文件权限'),'继续前提示重新授予文件权限');
  const action=[...document.querySelectorAll('.gm-files-task button')].find(b=>b.textContent==='继续');assert(!!action,'总览直接提供继续入口');action.click();await wait(async()=> (await state()).tasks[0].status==='done');assert((await state()).verified,'恢复后完整落盘文件 SHA-256 一致');await wait(()=>document.querySelector('.gm-files-task').dataset.state==='done');assert(document.querySelector('.gm-files-task progress').value===100,'校验并保存后才标记完成');
  await fetch('/restore',{method:'POST'});assert((await state()).tasks[0].status==='done','重建主进程后保留已完成记录');controller.hide();controller.open(config.devices[0].machineId);const frame=document.querySelector('.gm-files-frames iframe');
  const page=await command(frame,'prepare');assert(page.hint.includes('1 TiB')&&!page.hint.includes('512 MiB'),'新版文件页说明流式落盘和新的限制');await command(frame,'upload');controller.hide();await wait(async()=> (await state()).uploaded);await wait(async()=> (await state()).tasks.at(-1).status==='done');assert(true,'收起文件中心后原生上传继续并保存完成记录');
  controller.open(config.devices[0].machineId);await command(frame,'tasks');await new Promise(r=>setTimeout(r,800));const view=await command(frame,'state');assert(view.text.includes('已校验并保存'),'设备任务页显示本机落盘确认');assert(!view.overflow,'文件页没有水平溢出');const filtered=await command(frame,'filter-check');assert(filtered.search&&filtered.empty,'设备任务支持中文名称搜索与空结果提示');assert(filtered.done,'设备任务支持状态筛选');assert(filtered.details&&filtered.retained,'来源、目标和摘要可展开，轮询保留展开状态');const calls=(await state()).calls;assert(calls.includes('pick-upload')&&calls.includes('resume'),'文件选择和恢复都通过受限主进程命令');assert(!frame.src.includes('token'),'任务页地址不携带连接凭据');const folder=await command(frame,'mkdir-check');assert(folder.created&&(await state()).createdFolder,'通过真实回环操作通道创建合成文件夹');assert(folder.existing,'重复创建由后端确认已存在而不覆盖');controller.hide();out.textContent=checks.join('\n')+'\n全部通过';
 }catch(e){controller?.hide();out.textContent=checks.join('\n')+'\nFAIL '+e.message;}
};
</script></html>
