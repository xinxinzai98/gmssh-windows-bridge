<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux 文件中心 · 本地 SSH 验证</title><link rel="stylesheet" href="/gmssh-theme.css"><style>body{margin:0;background:#171719;color:#eee;font:14px system-ui}.tabs-container{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px}.tabs-container button{padding:6px 12px}main{padding:30px}</style><div class="tabs-container"><div class="tabs-home"><button class="tab-chip tab-chip--home">首页</button></div><button id="run">运行 Linux 文件检查</button><span id="result" role="status">待运行</span></div><main><h1>Linux 文件中心 · 合成设备</h1><p>实际连接本机临时 SSH/SFTP 服务，系统文件窗口仅授权测试文件。</p></main><script src="/gmssh-files.js"></script><script>
const id='c'.repeat(32),wait=async fn=>{for(let i=0;i<500;i++){if(await fn())return;await new Promise(r=>setTimeout(r,30));}throw Error('Linux browser wait timed out');};let c;
window.electronAPI={invoke:async(_channel,request)=>request.type==='gmssh-files-state'?{status:'ok'}:fetch('/native',{method:'POST',body:JSON.stringify(request.data)}).then(r=>r.json())};window.gmsshHomeController={filesDevices:()=>[{id,name:'实验室 Linux',windows:false}]};c=installGMSSHFileCenter({viewerUrl:location.origin+'/',devices:[]});
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');try{await wait(()=>c.native&&c.linux);c.open(id);await wait(()=>document.querySelector('.gm-files-frames iframe'));const frame=document.querySelector('.gm-files-frames iframe');await wait(()=>frame.contentDocument?.querySelector('#file-list .file-row'));frame.contentWindow.postMessage({type:'linux-fixture-check'},location.origin);}catch(error){out.textContent='FAIL '+error.message;}};
window.addEventListener('message',event=>{if(event.source!==document.querySelector('.gm-files-frames iframe')?.contentWindow||event.origin!==location.origin||event.data?.type!=='linux-fixture-result')return;document.getElementById('result').textContent=event.data.error?'FAIL '+event.data.error:event.data.passed+' checks passed';document.getElementById('result').title=(event.data.checks||[]).join('\n');});
</script></html>
