<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合成桌面诊断</title><script>
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='gmssh-desktop-state-request')return;const now=new Date().toISOString();window.parent.postMessage({type:'gmssh-desktop-state',requestId:event.data.requestId,data:{engineVersion:'1.5.0',stages:[{id:'desktopTransport',state:'passed',code:'DESKTOP_TRANSPORT_READY',sampledAt:now},{id:'desktopHandshake',state:'passed',code:'DESKTOP_HANDSHAKE_OK',sampledAt:now},{id:'desktopAuth',state:'passed',code:'DESKTOP_AUTH_OK',sampledAt:now},{id:'firstFrame',state:'failed',code:'FIRST_FRAME_TIMEOUT',sampledAt:now},{id:'frames',state:'unchecked',code:'FIRST_FRAME_PENDING',sampledAt:now}],metrics:{fps:0,kibPerSecond:0,lastFrameAgeSeconds:null}}},event.origin);});
</script></html>
