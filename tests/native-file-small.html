<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>流式文件中心窄窗口检查</title><style>body{margin:20px;background:#141416;color:#ddd;font:14px system-ui}iframe{width:420px;height:640px;border:1px solid #555;max-width:100%}pre{white-space:pre-wrap}</style><h1>420 × 640 原生任务工作区</h1><button id="run">检查布局</button><pre id="result">待运行</pre><iframe id="small" title="原生文件中心小窗口" src="native-file-entry.html?preview=1"></iframe><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result'),checks=[],assert=(v,t)=>{if(!v)throw Error(t);checks.push('PASS '+t);};try{const frame=document.getElementById('small');for(let i=0;i<200&&!frame.contentDocument.querySelector('.gm-files-task');i++)await new Promise(r=>setTimeout(r,25));const doc=frame.contentDocument,rect=doc.querySelector('.gm-files-center').getBoundingClientRect();assert(rect.top>=40&&rect.bottom<=640&&rect.right<=420,'恢复中心位于标题栏下且保持在小窗口内');assert([...doc.querySelectorAll('.gm-files-header button,.gm-files-header select')].every(n=>{const r=n.getBoundingClientRect();return r.left>=0&&r.right<=420;}),'设备选择、任务与收起按钮均可达');assert([...doc.querySelectorAll('.gm-files-task button')].every(n=>{const r=n.getBoundingClientRect();return r.left>=0&&r.right<=420;}),'查看和继续操作不越出任务区域');assert(doc.querySelector('.gm-files-content').getBoundingClientRect().height>150,'任务列表保留足够的滚动高度');assert(doc.documentElement.scrollWidth<=420,'没有页面水平溢出');assert(doc.querySelectorAll('.gm-files-tabs').length===1,'主进程恢复不会新增重复文件入口');out.textContent=checks.join('\n')+'\n全部通过';}catch(e){out.textContent=checks.join('\n')+'\nFAIL '+e.message;}};
</script></html>
