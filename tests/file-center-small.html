<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>文件中心窄窗口检查</title><style>body{margin:20px;background:#141416;color:#ddd;font:14px system-ui}iframe{width:420px;height:640px;border:1px solid #555;max-width:100%}pre{white-space:pre-wrap}</style><h1>420 × 640 文件工作区</h1><button id="run">检查布局</button><pre id="result">待运行</pre><iframe id="small" title="文件中心小窗口" src="file-center-entry.html?preview=1"></iframe><script>
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result'),checks=[],assert=(value,text)=>{if(!value)throw Error(text);checks.push('PASS '+text);};try{const frame=document.getElementById('small');for(let i=0;i<300&&!frame.contentDocument.querySelector('.gm-files-center:not([hidden])');i++)await new Promise(r=>setTimeout(r,30));const doc=frame.contentDocument,root=doc.querySelector('.gm-files-center'),rect=root.getBoundingClientRect(),head=doc.querySelector('.gm-files-header').getBoundingClientRect();assert(rect.top>=40&&rect.right<=420&&rect.bottom<=640,'中心位于标题栏下且保持在窄窗口内');assert(head.height>60,'小窗口的设备选择和操作按钮自动换行');assert([...doc.querySelectorAll('.gm-files-header button, .gm-files-header select')].every(n=>{const b=n.getBoundingClientRect();return b.left>=0&&b.right<=420&&b.bottom<=640;}),'所有文件中心操作按钮可达');assert(doc.querySelector('.gm-files-content').getBoundingClientRect().height>150,'文件与任务内容保留可滚动的可用高度');assert(doc.querySelectorAll('.gm-files-tabs').length===1,'顶部只有一个文件中心入口');out.textContent=checks.join('\n')+'\n全部通过';}catch(error){out.textContent=checks.join('\n')+'\nFAIL '+error.message;}};
</script></html>
