<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>文件浏览小窗口检查</title><style>body{background:#141416;color:#ddd;font:14px system-ui}iframe{width:420px;height:440px;max-width:100%;border:1px solid #555}pre{white-space:pre-wrap}</style><h1>420 × 440 文件浏览</h1><button id="run">检查布局</button><pre id="result">待运行</pre><iframe id="small" title="小窗口文件浏览" src="file-browser-entry.html?preview=1"></iframe><script>
document.getElementById('run').onclick=async()=>{const checks=[],assert=(v,t)=>{if(!v)throw Error(t);checks.push('PASS '+t);};try{const frame=document.getElementById('small');for(let i=0;i<200&&frame.contentDocument.querySelectorAll('.file-row').length<5;i++)await new Promise(r=>setTimeout(r,20));const doc=frame.contentDocument,inside=node=>{const rect=node.getBoundingClientRect();return rect.left>=0&&rect.right<=420;};assert(doc.documentElement.scrollWidth<=420,'小窗口没有水平溢出');assert([...doc.querySelectorAll('.file-browser-tools input,.file-browser-tools select,.file-browser-tools button')].every(inside),'目录搜索、排序与刷新控件均可达');const view=doc.getElementById('file-browser-view');assert(view.scrollHeight>view.clientHeight,'较矮窗口的文件视图可整体滚动');view.scrollTop=view.scrollHeight;const list=doc.getElementById('file-list');assert(list.getBoundingClientRect().height>=100,'目录列表保留可操作高度');assert(list.getBoundingClientRect().top<440,'能滚动到达文件行');assert([...doc.querySelectorAll('.file-row button')].every(inside),'文件名、信息和下载按钮保持在窗口内');assert([...doc.querySelectorAll('.file-history-button,.file-upload-actions button')].every(inside),'导航和新建按钮保持在窗口内');[...doc.querySelectorAll('.file-upload-actions button')].find(b=>b.textContent==='新建文件夹').click();assert([...doc.querySelectorAll('.file-new-folder input,.file-new-folder button')].every(inside),'新建文件夹的输入与操作在小窗口可达');const remember=[...doc.querySelectorAll('.file-browser-tools button')].find(b=>b.textContent==='收藏目录');remember.click();for(let i=0;i<200&&!doc.querySelector('.file-place');i++)await new Promise(r=>setTimeout(r,15));doc.querySelector('.file-places').open=true;assert([...doc.querySelectorAll('.file-place button,.file-place>div')].every(inside),'常用目录与打开、移除按钮在小窗口可达');document.getElementById('result').textContent=checks.join('\n')+'\n全部通过';}catch(e){document.getElementById('result').textContent=checks.join('\n')+'\nFAIL '+e.message;}};
</script></html>
