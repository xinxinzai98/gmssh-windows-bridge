<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备工作区 · 本地合成验证</title><link rel="stylesheet" href="/gmssh-theme.css"><style>body{margin:0;background:#171719;color:#eee;font:14px system-ui}.tabs-container{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px}main{padding:24px}button{cursor:pointer}webview{box-sizing:border-box;background:#10131b;border:1px solid #494455;color:#a8d4ac;padding:30px;font:14px monospace}.gm-device-details{width:auto}</style>
<div class="tabs-container"><button class="tab-chip tab-chip--home">首页</button><button id="run">运行工作区检查</button><span id="result" role="status">待运行</span></div><main><h1>设备工作区 · 合成设备</h1><p>此页面使用本地合成桌面和终端，不连接任何真实设备。</p></main>
<script src="/gmssh-workspace.js"></script><script>
const win='a'.repeat(32),linux='b'.repeat(32),calls=[],controllers=new Map();let creates=0;
window.electronAPI={invoke:async(_channel,request)=>{calls.push(request.data);return fetch('/workspace',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(request.data)}).then(r=>r.json());}};
function native(id,terminal){let node=[...document.querySelectorAll('webview')].find(n=>n.dataset.fixtureId===id+terminal);if(!node){node=document.createElement('webview');node.className='home-container-view';node.dataset.fixtureId=id+terminal;node.setAttribute('src',location.origin+'/newweb/#/home?machineId='+id+'&onlyTerm='+(terminal?'1':'0'));node.textContent=(terminal?'$ gmssh — connected terminal':'Linux desktop')+'\nSynthetic device only\nNo production connection';node.style.position='absolute';node.style.opacity='0';document.body.append(node);}return node;}
window.gmsshHomeController={filesDevices:()=>[{id:win,name:'设计工作站',windows:true},{id:linux,name:'实验室服务器',windows:false}],openNative:(id,channel)=>native(id,channel==='terminal'),workspaceOverview:id=>{const n=document.createElement('article');n.className='gm-device-details';n.textContent=(id===win?'设计工作站':'实验室服务器')+' · 合成概览 · CPU 16% · 内存 8 / 32 GiB';return n;}};
const windows={show(){if(!this.panel){creates++;this.panel=document.createElement('section');this.panel.style='position:fixed;inset:48px 0 0;z-index:2147483000;background:#141414';const frame=document.createElement('iframe');frame.title='合成 Windows 桌面';frame.src='/desktop-fixture';frame.style='width:100%;height:100%;border:0';this.panel.append(frame);document.body.append(this.panel);}this.panel.hidden=false;},hide(){if(this.panel)this.panel.hidden=true;},frame(){return this.panel?.querySelector('iframe');},close(){this.panel?.remove();this.panel=null;}};controllers.set(win,windows);window.gmsshWindowsControllers=controllers;
window.fixtureActions=[];
window.gmsshFilesController={open:id=>window.fixtureActions.push({tool:'files',id}),hide(){}};
window.gmsshToolsController={open:id=>window.fixtureActions.push({tool:'tools',id})};
document.querySelector('.tab-chip--home').addEventListener('click',()=>windows.hide());
window.addEventListener('message',event=>{const frame=windows.frame();if(frame&&event.source===frame.contentWindow&&event.origin===new URL(frame.src).origin&&event.data?.type==='gmssh-open-file-center'){window.gmsshFilesController.open(win);frame.contentWindow.postMessage({type:'gmssh-file-center-opened',requestId:event.data.requestId},event.origin);}});
const c=installGMSSHWorkspace({viewerUrl:location.origin+'/'}),wait=async fn=>{for(let i=0;i<300;i++){if(await fn())return;await new Promise(r=>setTimeout(r,20));}throw Error('workspace wait timed out');};
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result'),checks=[],assert=(v,t)=>{if(!v)throw Error(t);checks.push(t);};try{
 await c.open(win,'split');await wait(()=>windows.frame());const frame=windows.frame(),term=native(win,true);await wait(()=>frame.dataset.ready==='1');assert(frame.closest('section').dataset.gmsshWorkspaceView===win,'桌面按当前设备定位');assert(term.dataset.gmsshWorkspaceView===win,'同设备终端并排定位');assert(term.parentElement===document.body,'原生 webview 保持在原 DOM，不移动或重建');const original=frame;
 await c.open(win,'overview');assert(!term.hasAttribute('data-gmssh-workspace-view'),'离开工作区恢复原生布局');await c.open(win,'split');assert(windows.frame()===original&&creates===1,'重复切换复用同一个桌面会话');
 await c.open(linux,'terminal');assert(native(linux,true).dataset.gmsshWorkspaceView===linux,'Linux 终端按精确设备绑定');assert(!term.hasAttribute('data-gmssh-workspace-view'),'设备切换不沿用另一台的输入区域');await c.open(win,'desktop');
 frame.contentWindow.postMessage({type:'fixture-preferences'},location.origin);await wait(()=>calls.some(r=>r.action==='layout'&&r.data.devices[win]?.quality==='best'));assert(!calls.some(r=>JSON.stringify(r).includes('password')),'工作区消息不携带凭据');
 [...document.querySelectorAll('.gm-workspace nav button')].find(n=>n.textContent==='记录').click();await wait(()=>document.querySelector('.gm-workspace-history article'));assert(!frame.closest('section').hasAttribute('data-gmssh-workspace-view'),'历史页不会被桌面重新覆盖');assert(document.querySelector('.gm-workspace-history').textContent.includes('已连接'),'历史依据实际桌面连接事件');assert(document.querySelector('.gm-workspace-history').textContent.includes('原生终端'),'原生窗口状态与已认证连接分开标注');
 const payload=await fetch('/workspace-state').then(r=>r.json());assert(payload.devices[win].quality==='best'&&payload.devices[linux].quality==='balanced','两台设备的偏好各自保存');assert(payload.sessions.some(s=>s.channel==='terminal'&&s.machineId===linux),'原生终端生命周期进入本机历史');
 await c.open(win,'split');out.textContent=checks.length+' checks passed';out.title=checks.join('\n');window.fixtureResult={passed:checks.length,checks};
 }catch(error){out.textContent='FAIL '+error.message;window.fixtureResult={error:error.message,checks};}};
window.addEventListener('message',event=>{if(event.source===windows.frame()?.contentWindow&&event.data?.type==='fixture-ready')windows.frame().dataset.ready='1';});
</script></html>
