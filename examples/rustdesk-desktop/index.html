<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Windows 桌面 · RustDesk</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #13181f; color: #e9edf3; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 16px 20px; background: #1c2430; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  label { white-space: nowrap; }
  input { flex: 1; min-width: 200px; background: #10161e; border: 1px solid #4c596a; }
  input, button { border-radius: 6px; color: inherit; padding: 9px 12px; font: inherit; }
  button { border: 1px solid #566479; background: #29374b; cursor: pointer; }
  button[type=submit] { background: #205daa; border-color: #3d7fcf; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid #78b5ff; outline-offset: 2px; }
  p { margin: 10px 0 0; color: #b4c0d1; line-height: 1.5; }
  main { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #empty { text-align: center; max-width: 560px; padding: 24px; }
  #leave-fullscreen { display: none; position: absolute; top: 12px; right: 12px; z-index: 1; }
  #viewport:fullscreen #leave-fullscreen { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: white; }
  [hidden] { display: none !important; }
</style>
<header>
  <h1>Windows 桌面 · RustDesk</h1>
  <form id="connect">
    <label for="viewer">Web 服务</label>
    <input id="viewer" type="url" required placeholder="https://你的服务器/web" autocomplete="off" spellcheck="false" aria-describedby="help">
    <button type="submit">打开</button>
    <button id="disconnect" type="button" disabled>断开</button>
    <button id="fullscreen" type="button" disabled>全屏</button>
  </form>
  <p id="help">填写允许内嵌的 RustDesk Web 地址。在查看器中输入设备 ID 和 RustDesk 密码。</p>
  <p id="status" role="status" aria-live="polite">尚未打开查看器。</p>
</header>
<main id="viewport">
  <button id="leave-fullscreen" type="button">退出全屏</button>
  <div id="empty">
    <strong>在这里操作 Windows 桌面</strong>
    <p>需要已运行的 RustDesk Web 服务，以及目标 Windows 上的 RustDesk。</p>
    <p>官方公共 Web 页限制 iframe 内嵌。页面打开后仍需核对真实画面、键盘和鼠标是否可用。</p>
  </div>
</main>
<script>
  const form = document.getElementById('connect');
  const input = document.getElementById('viewer');
  const viewport = document.getElementById('viewport');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');
  const disconnect = document.getElementById('disconnect');
  const fullscreen = document.getElementById('fullscreen');
  let frame;

  function closeViewer() {
    frame?.remove();
    frame = undefined;
    empty.hidden = false;
    disconnect.disabled = fullscreen.disabled = true;
    status.textContent = '查看器已移除。远程设备上的 RustDesk 继续运行。';
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    try {
      const url = new URL(input.value.trim());
      const local = ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);
      if (url.protocol !== 'https:' && !(url.protocol === 'http:' && local)) {
        throw new Error('请使用 HTTPS，或本机回环地址。');
      }
      if (url.username || url.password || url.search || url.hash) {
        throw new Error('请填写不带账号、密码、查询参数或片段的 Web 地址。');
      }
      if (['rustdesk.com', 'www.rustdesk.com'].includes(url.hostname)) {
        throw new Error('官方公共 Web 页限制 iframe 内嵌，请使用允许内嵌的自建服务。');
      }
      closeViewer();
      frame = document.createElement('iframe');
      frame.title = 'RustDesk 远程桌面查看器';
      frame.referrerPolicy = 'no-referrer';
      frame.allow = 'fullscreen; clipboard-read; clipboard-write';
      frame.src = url.href;
      viewport.append(frame);
      empty.hidden = true;
      disconnect.disabled = fullscreen.disabled = false;
      status.textContent = '已请求打开查看器。请确认远程画面与输入；白屏时检查服务的内嵌限制。';
    } catch (error) {
      status.textContent = error.message;
    }
  });
  disconnect.addEventListener('click', closeViewer);
  fullscreen.addEventListener('click', async () => {
    try { await viewport.requestFullscreen(); }
    catch { status.textContent = '当前容器未允许全屏，请使用 GMSSH 窗口最大化。'; }
  });
  document.getElementById('leave-fullscreen').addEventListener('click', async () => {
    try { await document.exitFullscreen(); }
    catch { status.textContent = '全屏退出失败，请尝试 Esc。'; }
  });
</script>
</html>
