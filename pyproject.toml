[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmssh-windows-bridge"
version = "0.3.0"
description = "Unofficial Windows metrics bridge with opt-in SSH terminal and SFTP"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["paramiko>=3.4,<6"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: System :: Monitoring", "Programming Language :: Python :: 3"]

[project.scripts]
gmssh-windows-bridge = "gmssh_windows_bridge.bridge:main"

[tool.setuptools.package-data]
gmssh_windows_bridge = ["*.ps1"]

[tool.setuptools.packages.find]
include = ["gmssh_windows_bridge*"]
